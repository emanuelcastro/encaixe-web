<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Uma cruzadinha pequena por dia, a mesma para todo o Brasil.">
  <meta name="theme-color" content="#F6F1E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Encaixe">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Prévia do link no WhatsApp e nas redes (Open Graph). A imagem precisa de endereço completo. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Encaixe">
  <meta property="og:title" content="Encaixe: Cruzadinha Diária">
  <meta property="og:description" content="Uma cruzadinha por dia, a mesma para todo o Brasil. Resolva em poucos minutos e compare o tempo com os amigos.">
  <meta property="og:url" content="https://jogoencaixe.com.br/">
  <meta property="og:image" content="https://jogoencaixe.com.br/previa.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo do Encaixe: a letra E feita de casas de palavra cruzada">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Abre as conexões com o CanvasKit (motor de desenho) e o Firestore enquanto o jogo baixa. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

  <title>Encaixe: Cruzadinha Diária</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F6F1E7; }
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px;
      align-items: center; justify-content: center;
      font: 700 30px Georgia, 'Times New Roman', serif; letter-spacing: -0.5px; color: #1C1B19;
    }
    /* Conexão lenta: depois de 4 s, avisa que a primeira visita demora (o jogo tem uns 2 MB). */
    #carregando .lento {
      font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0; color: #5A5650;
      text-align: center; max-width: 280px; opacity: 0; animation: aparecer .6s ease 4s forwards;
    }
    @keyframes aparecer { to { opacity: 1; } }
    /* Modo escuro (do aparelho ou escolhido no jogo): cores da Paleta.escura (lib/tema.dart). */
    @media (prefers-color-scheme: dark) {
      html:not(.claro), html:not(.claro) body { background: #161513; }
      html:not(.claro) #carregando { color: #F1ECE2; }
      html:not(.claro) #carregando .lento { color: #A8A196; }
    }
    html.escuro, html.escuro body { background: #161513; }
    html.escuro #carregando { color: #F1ECE2; }
    html.escuro #carregando .lento { color: #A8A196; }
  </style>
  <script>
    // Aparência escolhida no jogo (guardada pelo shared_preferences como "flutter.aparencia"),
    // para a tela de carregamento já abrir na cor certa.
    try {
      var a = JSON.parse(localStorage.getItem('flutter.aparencia') || 'null');
      if (a === 'escuro' || a === 'claro') document.documentElement.classList.add(a);
    } catch (e) {}
  </script>
</head>
<body>

">Na primeira visita demora um pouquinho. Nas próximas, abre na hora.</div></div>
