<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baixe o Encaixe</title>
  <meta name="description" content="Baixe o Encaixe no iPhone ou no Android: cruzadinha, Palavra do dia, Conexões e outros desafios rápidos todo dia.">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Encaixe">
  <meta property="og:title" content="Baixe o Encaixe: Desafios Diários">
  <meta property="og:description" content="Cruzadinha, Palavra do dia, Conexões e outros desafios rápidos todo dia, os mesmos para todo o Brasil. No iPhone e no Android.">
  <meta property="og:url" content="https://jogoencaixe.com.br/baixar/">
  <meta property="og:image" content="https://jogoencaixe.com.br/previa.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="pt_BR">

  <style>
    @font-face { font-family: Figtree; font-weight: 400; src: url(../assets/assets/fontes/Figtree-Regular.ttf); }
    @font-face { font-family: Figtree; font-weight: 700; src: url(../assets/assets/fontes/Figtree-Bold.ttf); }
    @font-face { font-family: Fraunces; font-weight: 700; src: url(../assets/assets/fontes/Fraunces-Bold.ttf); }

    :root {
      --fundo: #F6F1E7; --tinta: #1C1B19; --secundario: #5A5650;
      --superficie: #FFFFFF; --marca: #1F5F8B; --amarelo: #F2B632; --borda: #DDD5C4;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --fundo: #161513; --tinta: #F1ECE2; --secundario: #A8A196;
        --superficie: #2B2925; --marca: #7DB4DE; --borda: #34312C;
      }
    }
    :root[data-theme="dark"] {
      --fundo: #161513; --tinta: #F1ECE2; --secundario: #A8A196;
      --superficie: #2B2925; --marca: #7DB4DE; --borda: #34312C;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--fundo); color: var(--tinta);
      font: 17px/1.5 Figtree, system-ui, sans-serif;
    }
    main {
      min-height: 100%; max-width: 480px; margin: 0 auto; padding: 48px 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    .icone {
      width: 112px; height: 112px; border-radius: 26px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
    }
    h1 { font: 700 34px/1.15 Fraunces, Georgia, serif; margin: 24px 0 8px; }
    h1 span { background: var(--amarelo); color: #1C1B19; padding: 0 3px; border-radius: 4px; }
    .resumo { color: var(--secundario); margin: 0 0 28px; }
    .status { font-weight: 700; margin: 0 0 16px; min-height: 1.5em; }
    .status[hidden] { display: block; visibility: hidden; }

    .lojas { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .loja { display: block; line-height: 0; border-radius: 12px; transition: transform .12s ease; }
    .loja:hover { transform: translateY(-1px); }
    .loja:active { transform: scale(.98); }
    .loja img { width: 200px; height: auto; }

    .conhecer { margin-top: 32px; color: var(--marca); font-weight: 700; }
    footer { margin-top: 40px; color: var(--secundario); font-size: 14px; }
    footer a { color: inherit; }
  </style>
  <script>
    // Mesma escolha de aparência do jogo (claro, escuro ou do sistema).
    try {
      var a = JSON.parse(localStorage.getItem('flutter.aparencia') || 'null');
      if (a === 'claro') document.documentElement.dataset.theme = 'light';
      if (a === 'escuro') document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
<main>
  <img class="icone" src="../icons/Icon-512.png" alt="Ícone do Encaixe" width="112" height="112">

  <h1>Baixe o Encai<span>x</span>e</h1>
  <p class="resumo">Cruzadinha, Palavra do dia, Conexões e outros desafios rápidos todo dia, os mesmos para todo o Brasil. Monte um grupo e compare com os amigos.</p>

  <p class="status" id="status" hidden>Abrindo a loja…</p>

  <div class="lojas" id="lojas">
    <a class="loja" id="appstore" href="https://apps.apple.com/br/app/id6818161841">
      <img src="badge-app-store.svg" alt="Baixar na App Store" width="180" height="54">
    </a>
    <a class="loja" id="googleplay" href="https://play.google.com/store/apps/details?id=com.vedigitalhub.encaixe">
      <img src="badge-google-play.svg" alt="Disponível no Google Play" width="180" height="54">
    </a>
  </div>

  <a class="conhecer" href="../">Jogar no navegador</a>

  <footer>
    <a href="../suporte/">Ajuda</a> · <a href="../privacidade/">Privacidade</a> · VeDigitalHub
  </footer>
</main>
<script>
  // No celular, vai direto para a loja do aparelho; no computador, mostra as duas.
  // Com ?ficar, não redireciona (para conferir a página no celular).
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    if (!ios && !android) return;

    var lojas = document.getElementById('lojas');
    var appStore = document.getElementById('appstore');
    var googlePlay = document.getElementById('googleplay');
    var destino = ios ? appStore : googlePlay;
    // A loja do aparelho vem primeiro.
    lojas.insertBefore(destino, lojas.firstChild);

    if (/[?&]ficar\b/.test(location.search)) return;
    document.getElementById('status').hidden = false;
    setTimeout(function () { location.replace(destino.href); }, 600);
    // Se a loja não abrir (ou a pessoa voltar), os botões continuam ali.
    setTimeout(function () { document.getElementById('status').hidden = true; }, 3000);
  })();
</script>
</body>
</html>
